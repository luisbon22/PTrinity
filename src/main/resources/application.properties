spring.application.name=ptrinity
server.port=${SERVER_PORT:8080}

# --- Base de datos (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ptrinity}
spring.datasource.username=${DB_USERNAME:ptrinity}
spring.datasource.password=${DB_PASSWORD:ptrinity}

# El esquema lo administra Flyway (DDL versionado); Hibernate solo lo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# db/migration = DDL, db/seed = DML de datos de demostración
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# --- Reglas de negocio configurables ---
bank.zone-id=America/Bogota
bank.checking.overdraft-limit=1000000

# --- Documentación de la API ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
