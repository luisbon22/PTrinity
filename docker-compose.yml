services:
  db:
    image: postgres:16-alpine
    container_name: ptrinity-db
    environment:
      POSTGRES_DB: ptrinity
      POSTGRES_USER: ptrinity
      POSTGRES_PASSWORD: ptrinity
      TZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - ptrinity-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptrinity -d ptrinity"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ptrinity-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ptrinity
      DB_USERNAME: ptrinity
      DB_PASSWORD: ptrinity
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  ptrinity-data:
