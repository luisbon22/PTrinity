name: CI/CD

# feature/* -> dev -> qa -> main. Cada push a una rama de ambiente prueba, construye
# y publica las imagenes en GitHub Container Registry con la etiqueta del ambiente.
on:
  push:
    branches: [dev, qa, main]
    tags: ['v*']
  pull_request:
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  flujo-de-ramas:
    name: Flujo de ramas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validar origen del pull request
        env:
          ORIGEN: ${{ github.head_ref }}
          DESTINO: ${{ github.base_ref }}
        run: |
          case "$DESTINO" in
            main) [ "$ORIGEN" = "qa" ] || [[ "$ORIGEN" == hotfix/* ]] || { echo "::error::A main solo llega qa o hotfix/*"; exit 1; } ;;
            qa)   [ "$ORIGEN" = "dev" ] || [[ "$ORIGEN" == hotfix/* ]] || { echo "::error::A qa solo llega dev o hotfix/*"; exit 1; } ;;
            dev)  [[ "$ORIGEN" == feature/* || "$ORIGEN" == fix/* || "$ORIGEN" == hotfix/* ]] || { echo "::error::A dev llegan feature/*, fix/* o hotfix/*"; exit 1; } ;;
          esac

  backend:
    name: Backend (pruebas y cobertura >= 85 %)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco

  frontend:
    name: Frontend (pruebas y cobertura >= 85 %)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-frontend
          path: frontend/coverage

  imagenes:
    name: Imagenes Docker (GHCR)
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        componente: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Etiqueta del ambiente
        id: ambiente
        run: |
          case "${GITHUB_REF}" in
            refs/heads/main) echo "etiqueta=latest" >> "$GITHUB_OUTPUT" ;;
            refs/tags/*)     echo "etiqueta=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT" ;;
            *)               echo "etiqueta=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.componente }}
          # Las pruebas ya corrieron en los jobs anteriores
          build-args: OMITIR_PRUEBAS=true
          push: true
          tags: |
            ghcr.io/${{ steps.ambiente.outputs.repo }}-${{ matrix.componente }}:${{ steps.ambiente.outputs.etiqueta }}
            ghcr.io/${{ steps.ambiente.outputs.repo }}-${{ matrix.componente }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}
