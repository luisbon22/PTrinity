# Configuracion comun a todos los ambientes.
# Ambientes: dev (rama dev), qa (rama qa), prod (rama main). "local" corre sin Docker con H2.
spring:
  application:
    name: ptrinity
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ptrinity}
    username: ${DB_USERNAME:ptrinity}
    password: ${DB_PASSWORD:ptrinity}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # DDL siempre; los datos de demostracion (DML) se agregan por ambiente
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  zona-horaria: America/Bogota
  ambiente: ${spring.profiles.active:dev}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    nombre: PTrinity
    version: '@project.version@'
    ambiente: ${app.ambiente}
